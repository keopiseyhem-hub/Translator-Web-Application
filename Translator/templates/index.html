<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Translator</title>
    <style>
 *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.container{
    margin:50px auto;
    width: 60%;
    text-align: center;
    border-radius: 15px;
    border: 2px solid rgb(90, 88, 88);
    box-shadow: 0px 5px 20px 10px rgba(128, 129, 120, 0.5);
}
.navbar{
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
}
.navbar i{
    color: rgb(2, 23, 73);
    font-size:40px ;
}
.navbar h1{
    color: rgb(2, 23, 73);
   
}
.main{
    width: 40%;
}
.main .select-box{
    width: 70%;
    height: 35px;
    margin-bottom: 20px;
    border-radius: 15px;
    padding-left: 2rem;
    border: 2px solid rgb(104, 103, 103);
    background-color: rgb(228, 226, 225);

}

textarea{
    height: 250px;
    width: 100%;
    font-size: 20PX;
    padding: 20px;
    border-radius: 20px;
    margin: 0;
}
.icon{
    display: flex;
    justify-content: space-around;
    margin: 0;
}
.icon i{
    font-size: 20px;
    color: rgb(66, 65, 65);
}

.form{
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    width: 100%;
}
.btn button{
    margin-top: 10px;
    width: 10rem;
    background-color:rgb(2, 23, 73) ;
    color: white;
    padding:15px 25px;
    border:none;
    border-radius: 10px;
    box-shadow:0px 0px 2px 2px rgba(104, 99, 178, 0.5); 
}
.btn button:active{
    background-color: rgba(2, 23, 73, 0.838);
    transition: 0.1s ease;
}
.rate{
    margin: 20px auto;
    padding: 10px 0px;
    width: 70%;
    display: flex;
    justify-content: space-evenly;
    border-radius: 30px;
    border: 2px rgb(78, 78, 78) solid;
}
.rate i{
    color: rgb(232, 217, 6);
    font-size: 18px;
}
.rate p{
    font-size: 18px;
}
.footer{
    display: flex;
    justify-content: space-around;
    margin: 40px auto 30px auto;
    font-family: Arial, sans-serif;
    color: rgb(36, 36, 36);
    height: 80px;
    width: 70%;
}
.footer div i{
    font-size: 25px;
    color: rgb(36, 36, 36);
    padding: 10px;
    border-radius: 50%;
    border: 1px solid rgb(36, 36, 36);
}
.footer div h5{
    margin-top: 20px;
}


    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1>Brae Translate</h1>
            <i class="bi bi-translate"></i>
        </nav>

        <form  action="" method="POST">
            {% csrf_token %}
            <div class="form">
            <div class="main">
                <select class="select-box"  name="select_input" id="select-input" >
                    <option value="en" {% if select_input == 'en' %}selected{% endif %}>
                        English
                    </option>
                    <option value="km" {% if select_input == 'km' %}selected{% endif %}>
                        Khmer
                    </option>
                    <option value="zh-CN" {% if select_input == 'zh-CN' %}selected{% endif %}>
                        Chinese
                    </option>
                    <option value="ko" {% if select_input == 'ko' %}selected{% endif %}>
                        korean
                    </option>
                    <option value="ja" {% if select_input == 'ja' %}selected{% endif %}>
                        Japanese
                    </option>
                    <option value="de" {% if select_input == 'de' %}selected{% endif %}>
                        German
                    </option>
                    <option value="vi" {% if select_input == 'vi' %}selected{% endif %}>
                        Vietnamese
                    </option>
                    <option value="id" {% if select_input == 'id' %}selected{% endif %}>
                        Indonesian
                    </option>
                    <option value="fil" {% if select_input == 'fil' %}selected{% endif %}>
                        Filipino
                    </option>
                    <option value="ms" {% if select_input == 'ms' %}selected{% endif %}>
                        Malay
                    </option>
                    <option value="lo" {% if select_input == 'lo' %}selected{% endif %}>
                        lao
                    </option>
                     <option value="fr" {% if select_input == 'fr' %}selected{% endif %}>
                        French
                    </option>
                    <option value="hi" {% if select_input == 'hi' %}selected{% endif %}>
                        Indian
                    </option>                   
                </select>
                <textarea name="input_text" id="input_text" placeholder="Enter Text">{{ input_text }}</textarea>
                <div class="icon">
                    <i id="copy-input" class="bi bi-copy"></i>
                    <i id="volume-input" class="bi bi-volume-up-fill"></i>
                    <i id="trash-input" class="bi bi-trash3"></i>
                </div>
            </div>
            <div><i class="bi bi-arrow-left-right"></i></div>
            <div class="main">
                <select class="select-box"  name="select_output"  id="select-output">
                    <option value="en" {% if select_output == 'en' %}selected{% endif %}>
                        English
                    </option>
                    <option value="km" {% if select_output == 'km' %}selected{% endif %}>
                        Khmer
                    </option>
                    <option value="zh-CN" {% if select_output == 'zh-CN' %}selected{% endif %}>
                        Chinese
                    </option>
                    <option value="ko" {% if select_output == 'ko' %}selected{% endif %}>
                        korean
                    </option>
                    <option value="ja" {% if select_output == 'ja' %}selected{% endif %}>
                        Japanese
                    </option>
                    <option value="de" {% if select_output == 'de' %}selected{% endif %}>
                        German
                    </option>
                    <option value="vi" {% if select_output == 'vi' %}selected{% endif %}>
                        Vietnamese
                    </option>
                    <option value="id" {% if select_output == 'id' %}selected{% endif %}>
                        Indonesian
                    </option>
                    <option value="fil" {% if select_output == 'fil' %}selected{% endif %}>
                        Filipino
                    </option>
                    <option value="ms" {% if select_output == 'ms' %}selected{% endif %}>
                        Malay
                    </option>
                    <option value="lo" {% if select_output == 'lo' %}selected{% endif %}>
                        lao
                    </option>
                     <option value="fr" {% if select_output == 'fr' %}selected{% endif %}>
                        French
                    </option>
                    <option value="hi" {% if select_output == 'hi' %}selected{% endif %}>
                        Indian
                    </option>             
                </select>
                <textarea name="output_text" id="output_text" placeholder="Translation">{{ output_text }}</textarea>
                <div class="icon">
                    <i id="copy-output" class="bi bi-copy"></i>
                    <i id="volume-output" class="bi bi-volume-up-fill"></i>
                    <i id="trash-output" class="bi bi-trash3"></i>
                </div>
            </div>
        </div>
            <div class="btn">
            <button type="submit">Translate</button>
        </div>
        </form>

        
    <div class="rate">
        <p>Rate The Translation</p>
        <div>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star"></i>
        </div>
        
    </div>
    <div class="footer">
        <div>
            <i class="bi bi-hourglass"></i>
            <h5>History</h5>
        </div>
        <div>
            <i class="bi bi-star"></i>
            <h5>Saved</h5>
        </div>
        <div>
            <i class="bi bi-people"></i>
            <h5>Contribute</h5>
        </div>
    </div>
    </div>

    <script>
        document.getElementById('trash-input').addEventListener('click',function(e){
            e.preventDefault();
            document.getElementById('input_text').value='';
        });
         document.getElementById('trash-output').addEventListener('click',function(e){
            e.preventDefault();
            document.getElementById('output_text').value='';
        });
        document.getElementById('copy-input').addEventListener('click',function(e){
            e.preventDefault();
            let inputtext=document.getElementById('input_text');
            inputtext.select();
            document.execCommand('copy');
            alert('Copied the text!');
        });
        document.getElementById('copy-output').addEventListener('click',function(e){
            e.preventDefault();
            let outputtext=document.getElementById('output_text');
            outputtext.select();
            document.execCommand('copy');
            alert('Copied the text!');
        })
        document.getElementById('volume-input').addEventListener('click',function(e){
            e.preventDefault();
            let input=document.getElementById('input_text').value;
            if(input){
                let inputsound=new SpeechSynthesisUtterance(input);
                inputsound.lang=document.getElementById('select-input').value;
                window.speechSynthesis.speak(inputsound);
            }
        })
        document.getElementById('volume-output').addEventListener('click',function(e){
            e.preventDefault();
            let output=document.getElementById('output_text').value;
            if(output){
                let outputsound=new SpeechSynthesisUtterance(output);
                outputsound.lang=document.getElementById('select-output').value;
                window.speechSynthesis.speak(outputsound);
            }
        })

    </script>
</body>
</html>
